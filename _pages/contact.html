layout: page
title: Let's get the ball rolling.
permalink: /contact/
---

<div class="form-box" style="text-align: center">
  <div class="contact-head">
    {% if site.data.settings.contact.description %}
      <p class="page-description">{{site.data.settings.contact.description}}</p>
    {% endif %}
  </div>
  <form class="form" action="https://formspree.io/f/xpwzawww" method="POST">
    <div class="form__group">
      <label class="form__label screen-reader-text" for="form-name">Your Name</label>
      <input class="form__input" id="form-name" type="text" name="name" placeholder="Name" required>
    </div>
    <div class="form__group">
      <label class="form__label screen-reader-text" for="form-email">Your Email</label>
      <input class="form__input" id="form-email" type="email" name="_replyto" placeholder="Email" required>
    </div>
    <div class="form__group">
      <label class="form__label screen-reader-text" for="form-text">Your Message</label>
      <textarea class="form__input" id="form-text" name="text" rows="10" placeholder="Project Details" required></textarea>
    </div>
    <div class="form__group">
      <button class="button" type="submit">Send Message</button>
    </div>
  </form>
</div>

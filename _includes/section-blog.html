<!-- begin blog -->
<section class="blog section">

  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="section__info">
          <div class="section__head">
            <h2 class="section__title">Recent blog posts</h2>
            <a class="section__link" href="{{ '/blog/' | relative_url }}">Explore all writing</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col col-12">
        {% include post-list.html posts=site.posts limit=5 %}
      </div>
    </div>
  </div>

</section>
<!-- end blog -->

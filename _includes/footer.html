<!-- begin footer -->
<footer class="footer">

  <div class="container">
    <div class="row">
      <div class="col col-12">

        <div class="footer__inner">
          {% if site.data.settings.social %}
            <div class="social">
              <ul class="social__list list-reset">
                {% for social in site.data.settings.social %}
                  <li class="social__item">
                    <a class="social__link" href="{{ social.link }}" aria-label="{{ social.label | escape }}" title="{{ social.label | escape }}"><i class="ion {{ social.icon }}" aria-hidden="true"></i></a>
                  </li>
                {% endfor %}
              </ul>
            </div>
          {% endif %}
        </div>

        <div class="footer__info">
          <div class="footer__links">
            <a href="https://ashutoshbhosale.com/">Work portfolio {% include external-icon.html %}</a>
            <a href="{{ '/contact/' | relative_url }}">Contact</a>
            <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          </div>
          <div class="copyright">{{site.time | date: '%Y'}} &copy; <a href="/">{{site.data.settings.title}}</a>.</div>
        </div>

      </div>
    </div>
  </div>

</footer>
<!-- end footer -->

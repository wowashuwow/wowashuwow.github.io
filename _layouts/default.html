<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body{% if site.design_variant == 'compact' %} class="design-compact"{% endif %}>
  <a class="skip-link" href="#main-content">Skip to content</a>

  {% if site.data.settings.google-analytics %}
    {% include google-analytics.html %}
  {% endif %}

  {% include header.html %}

  <!-- begin content -->
  <main class="content" id="main-content" tabindex="-1" aria-label="Content">
    {{ content }}
  </main>
  <!-- end content -->

  <button class="top" type="button" aria-label="Back to top"><i class="ion ion-ios-arrow-round-up" aria-hidden="true"></i></button>

  {% include footer.html %}

  <script src="{{ site.baseurl }}/js/scripts.js"></script>
  <script src="{{ site.baseurl }}/js/common.js"></script>
</body>

</html>

- id: '32508'
  title: 'The Black Echo (Harry Bosch, #1; Harry Bosch Universe, #1)'
  author: Michael Connelly
  status: read
  source_url: https://www.goodreads.com/book/show/32508
  rating: 4
  isbn: '9780446612739'
  date_read: '2026-06-29'
  review_html: '4.5/5  ⭐<br>Absolute page-turner. Un-put-downer. Every minute spent
    reading was worth it.<br><br>What a debut. Having already watched the show, it
    was a treat to finally read where it all began. The writing was enjoyable, the
    plotting was well thought-out, and the broader story was deeply satisfying with
    just the right amount of suspense, action, drama, twists and turns. Enough information
    was given. Nothing was held back. As a reader, I did not feel deceived one bit
    and fully enjoyed the experience. This is what crime fiction should aspire to.
    Like mutton cooked to perfection in ghee - I wanted to keep eating because it
    simply melted in the mouth. I might write an expanded review in the future. Right
    now, I''m just hurrying to grab #2 in the series.'

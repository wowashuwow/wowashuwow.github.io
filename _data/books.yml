- id: '1200268'
  title: Let It Bleed
  author: Ian Rankin
  status: read
  source_url: https://www.goodreads.com/book/show/1200268
  rating: 4
  isbn: '9780752877198'
  date_read: '2026-09-09'
  review_html: 'I chose to read Let it Bleed as my next Rebus book because it was
    recommended by a few people on Reddit as their favorite one in the series. Although
    I enjoyed the story and the reading journey, I feel my previous two Rebus reads
    were more enjoyable: Knots and Crosses was fun with its Le Carre-like story and
    getting really up close and personal into Rebus''s personal life, and Set in Darkness
    was a lot more atmospheric - I could almost feel Edinburgh on my skin. Set in
    Darkness too had an open-ended ending, but not as open as this one. At least a
    few of the factors that influence the possible endings here should have been solidified;
    without that, you can''t really speculate the possible endings. I feel Rankin
    left it way too open-ended. Still, this was an entertaining read, it satisfyingly
    scratched my perpetual crime-story itch and kept me happy for a good couple of
    weeks. <br><br>3.5 stars out of 5.'

- id: '54821231'
  title: The Hunting
  author: Stephen Leather
  status: read
  source_url: https://www.goodreads.com/book/show/54821231
  rating: 2
  date_read: '2026-03-30'
  review_html: The plot was fun. Wish it was executed better. <br><br>Writing was
    okay. If I’d had a vodka shot every time “he frowned” or “he threw his hands up,”
    I’d have been dead from liver damage by the time I was halfway into the book.
    Couldn’t connect with the characters, although attempts were made to characterize
    them. A few sections rambled too much without adding to the story. The book could’ve
    been much shorter. Pacing was all over the place, neutral at the start, then slow
    for a long time, then really picked up after 80%, and that was a lot of fun. Overall,
    it was an underwhelming experience. It’s sad when a great idea doesn’t live up
    to its potential. This would work well as a film though - it would be a fucking
    awesome blockbuster action flick with the right direction and cast. It almost
    feels as if it was written with that very intention (which would explain why the
    writing feels so off). Somebody needs to pick up the rights and do it.

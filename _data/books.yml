- id: '102139'
  title: 'Gallows View (Inspector Banks, #1)'
  author: Peter    Robinson
  status: read
  source_url: https://www.goodreads.com/book/show/102139
  rating: 3
  isbn: '9780380714001'
  date_read: '2026-06-18'
  review_html: This is, overall, an enjoyable British detective story, but I have
    two main gripes with this book. The first one is that I couldn't connect with
    DCI Banks as much as I'd liked to. That is in part because Banks is quite different
    compared to my favorites - Inspector Rebus (by Ian Rankin) and Inspector Morse
    (by Colin Dexter). Banks is married with kids while the other two are bachelors
    (well, Rebus is divorced, and although he has a kid, she doesn't live with him),
    which fundamentally changes the dynamic of his life, but still, that wasn't the
    only reason. It's not like I can never connect with married protagonists who don't
    have abnormal family lives or sexual escapades. I learnt about Banks's taste in
    operas and bands and biscuits that made things somewhat better, but it simply
    wasn't enough. The characterization of Banks was simply lacking. I was left wanting
    more backstory, mannerisms, thoughts... anything that would help me connect with
    him better<br><br>My other gripe is the lack of atmosphere in this book. I'm a
    sucker for atmosphere. I love how Rankin paints Edinburgh's. I revel in its shitty
    (subjective) weather. When you couple that with how intimately Rankin has characterized
    Rebus, I find that I'm living with him, thinking with him, moving with him, feeling
    and sensing the surroundings with him. Which is why he's my favorite of the lot.
    In Morse's case, too, although the characterization is slightly lacking, the prose
    more than make up for it with the dreamy, rainy, foggy, mysterious portrayal of
    the Oxfordshire. While Robinson has made attempts to describe Eastvale, Yorkshire
    and "The North" in general, it wasn't enough. I got the feeling as if I was supposed
    to already know the place or at least have a general idea of it, and as if it
    was my fault that I did not. Perhaps he did not readers from outside the UK when
    he wrote the book. I don't know.<br><br>Overall, the lack of these two things
    left me feeling like I was too much of an outside observer; there was an invisible
    barrier between me and the story that just wouldn't let me be a part of it completely.
    I expect the books get better, just like for any other detective series; so it's
    not that I will never pick another DCI Banks novel, but I will not be picking
    one up anytime soon.<br><br>Although I have been critical about this book, and
    since this is less of a standalone review and more of a comparison of three detective
    series, I think I may have come across as if I did not like this book. That is
    not true. As a standalone book, I still recommend this for anyone looking to enjoy
    a British detective story with a pretty-decent-yet-not-groundbreaking plot.<br>---<br>Next
    up, I'm (finally) picking up The Black Echo by Michael Connelly.

- id: '126507'
  title: 'Lost Light (Harry Bosch, #9; Harry Bosch Universe, #13)'
  author: Michael Connelly
  status: read
  source_url: https://www.goodreads.com/book/show/126507
  rating: 5
  isbn: '9780446611633'
  review_html: 'I devoured this one like a starved lion who finds a big, meaty African
    buffalo after a long, dry spell. Except in reality, it''s only been a couple days
    since his last meal; it''s just that the meat is so good that he feels like he
    was famished for months. I took only seven days to finish this, and I savored
    every bite of the delicious meat of this African buffalo of a book. It felt like
    every day of those seven days, when I was reading this book, I was having a perfectly
    grilled steak from Musso''s. <br><br>Oh, when will the day come when I will finally
    visit LA and spend an entire day visiting all of Bosch''s favorite places? Even
    Kate Mantilini, the infamous restaurant from the 1995 film ''Heat''—the best film
    ever created, never argue on this with me—makes a guest appearance in this book,
    as Connelly recreates the Pacino-De Niro scene but with Bosch in the diner with
    his adversary and even directly references the film. Bosch''s words: "Did you
    ever see the movie Heat? This is the place where Pacino the cop meets De Niro
    the burglar. It''s where they both tell each other they won''t hesitate to put
    the other down if it comes to that."<br><br>But this book does more than the film
    and jazz loring and LA touring (there''s plenty of that). The plot''s good, it
    resolves well. It is a sensible, fun, and satisfying detective story. My only
    complaint is that the case comes to a close rather suddenly, but the action at
    that close is so sit-on-the-edge-of-your-seat page-turning that I''m really nitpicking
    here. <br><br>Bosch''s will-do-anything-for-justice character shines through during
    many instances in the story; it always makes me happy to see that and makes me
    admire him as a character despite all his shortcomings. The biggest shortcoming
    being he creates a lot of problems for other people in his personal and professional
    lives in his quest for justice. Bosch''s personal story in the book is touching
    and comes to a close in a beautifully satisfying emotional catharsis, and it is
    written just as beautifully; the writing does justice to it. <br><br>Although
    this is only my second Bosch book, the first one being ''The Black Echo''—the
    very first book in the series—I can see a few differences in the writing style,
    even though I don''t love all of them. While the writing in this book flows smoothly,
    is accessible yet witty, and describes emotional moments and thoughts effectively
    and beautifully, I feel the writing style of the first book was more  original
    and had more character throughout. Here, it''s like character is thrown in once
    in a while, while the rest of the time the story is told in a "normal" way. Not
    to say that''s a bad thing, I think that''s a stylistic choice and it works well
    for telling a story like this, although I would love to see what Connelly could
    do if he went unhinged, like say, Ellroy, to give an extreme example. <br><br>Finally,
    I want to mention that as someone who''s a fan of the TV show (Bosch) and liked
    the spinoff (Bosch: Legacy), imagining Titus Welliver and Sarah Clarke while reading
    this added to the fun. Although I cannot imagine anyone else playing Bosch right
    now, I think yet another spinoff featuring a young Bosch showing us his formative
    years might be possible if executed well; it might appeal to a younger audience.
    The ending scene made me think of this.<br><br>I will end this off-the-top-of-my-head
    review that I''m writing fresh after I''ve just finished this book with one suggestion:
    If you like crime fiction, do yourself a favor and read this book.'

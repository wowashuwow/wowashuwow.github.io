  date_read: '2025-09-06'
  review_html: Gem of a whodunnit set in 90s dark, wet, and very Scottish Scotland.
    <br><br>Reading this book was like playing a TV show in my head. The writing makes
    you imagine detailed scenes, it’s so cinematic. Is there a word for this kind
    of writing? I loved  how the characters had their own side-quests, how the narrator
    took me inside the heads of characters with opposing personalities (great writing
    there), and the atmosphere. <br><br>One fine day in the story, the sun’s out,
    but it’s also cold, windy, and raining at the same time. I was trying to imagine
    how that would feel like on my skin. Anyone from Scotland here? Is Edinburgh really
    like this? <br><br>⭐️⭐️⭐️⭐️ 4/5 for my first ever Inspector Rebus novel. Looking
    forward to pick up another one. Bonus points because it reminded me of Bosch (Prime
    Video) and Heat (Michael Mann).

#-------------------------------
# General Site Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://wowashuwow.com" # the base hostname & protocol for your site, e.g. http://example.com
# Metadata used by jekyll-seo-tag; keep consistent with _data/settings.yml.
title: wowashuwow
author: Ashutosh Bhosale
description: "wowashuwow (Ashutosh) is a full-stack writer, photographer, and fitness enthusiast. This is his personal blog."


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

paginate: 9
paginate_path: "/blog/page/:num"

kramdown:
  hard_wrap: true

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext
  - scope:
      path: '_posts'
    values:
      permalink: /blog/:slug

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed

timezone: Asia/Kolkata
future: true

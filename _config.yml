#-------------------------------
# General Site Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://wowashuwow.com" # the base hostname & protocol for your site, e.g. http://example.com
# Metadata used by jekyll-seo-tag; keep consistent with _data/settings.yml.
title: wowashuwow
author: Ashutosh Bhosale
description: "wowashuwow (Ashutosh) is a full-stack writer, photographer, and fitness enthusiast. This is his personal blog."


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

design_variant: compact

kramdown:
  hard_wrap: true

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext
  - scope:
      path: '_posts'
    values:
      permalink: /blog/:slug

include:
  - _pages

exclude:
  - docs
  - Drafts
  - .obsidian
  - .trash
  - _writing
  - images/2026-8-23-the-guilt-of-fitness-fi.jpg
  - vendor
  - Gemfile
  - Gemfile.lock

sass:
  sass_dir: _sass
  style: compressed

timezone: Asia/Kolkata
future: true
